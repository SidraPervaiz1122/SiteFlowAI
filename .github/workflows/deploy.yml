name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push Docker image
      run: |
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/siteflow:latest -t ${{ secrets.ACR_LOGIN_SERVER }}/siteflow:${{ github.sha }} .
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/siteflow:latest
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/siteflow:${{ github.sha }}

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Restart Azure Web App
      uses: azure/CLI@v1
      with:
        azcliversion: latest
        inlineScript: |
          az webapp restart --name ${{ secrets.AZURE_WEBAPP_NAME }} --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }}

    - name: Health Check
      run: |
        echo "Waiting for app to start..."
        sleep 60
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net)
        if [ "$HTTP_STATUS" -ne 200 ]; then
          echo "Health check failed with status code: $HTTP_STATUS"
          exit 1
        fi
        echo "Health check passed!"
